<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Expenses</title>
</head>
<body>
<h2>My Expenses</h2>
<a href="/expenses/add">Add New Expense</a>

<table border="1">
    <thead>
    <tr>
        <th>Amount</th>
        <th>Category</th>
        <th>Description</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="expense : ${expenses}">
        <td th:text="${expense.amount}"></td>
        <td th:text="${expense.category}"></td>
        <td th:text="${expense.description}"></td>
        <td th:text="${expense.expenseDate}"></td>
        <td>
            <a th:href="'/expenses/edit/' + ${expense.id}">Edit</a>
            |
            <a th:href="'/expenses/delete/' + ${expense.id}" onclick="return confirm('Are you sure?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<br/>
<a href="/">Back to Home</a>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
</head>
<body>
<h2>Add New Expense</h2>

<form th:action="@{/expenses/add}" th:object="${expense}" method="post">
    <div>
        <label>Amount:</label>
        <input type="number" step="0.01" th:field="*{amount}" required/>
    </div>

    <div>
        <label>Category:</label>
        <input type="text" th:field="*{category}" required/>
    </div>

    <div>
        <label>Description (Optional):</label>
        <input type="text" th:field="*{description}"/>
    </div>

    <div>
        <label>Date:</label>
        <input type="date" th:field="*{expenseDate}" required/>
    </div>

    <button type="submit">Save Expense</button>
</form>

<br/>
<a href="/expenses/list">Back to List</a>
</body>
</html>
